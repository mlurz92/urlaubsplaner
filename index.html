  <script>
    // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('urlaubsplaner.prefs.v1') || '{}');
        var t = p.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.density = p.density || 'comfort';
      } catch (e) {}
    })();
  </script>

  <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="#fff" stroke-width="1.9"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="15.2" r="2.3" fill="#ffd166"/></svg>
        </div>
        <div class="brand-text"><strong>Urlaubsplaner</strong><span>Jahresplanung · Sachsen</span></div>
      </div>

      <div class="yearnav" role="group" aria-label="Jahr wählen">
        <button class="btn ghost sm icon-only" data-action="year-prev" title="Vorjahr (Alt+←)"><svg class="icon sm"><use href="#i-chevron-left"/></svg></button>
        <select id="year-select" aria-label="Jahr"></select>
        <button class="btn ghost sm icon-only" data-action="year-next" title="Folgejahr (Alt+→)"><svg class="icon sm"><use href="#i-chevron-right"/></svg></button>
      </div>
      <button class="btn sm hide-sm" data-action="today" title="Zu heute springen (T)"><svg class="icon sm"><use href="#i-target"/></svg>Heute</button>

      <div class="seg views" role="tablist" aria-label="Ansicht">
        <button role="tab" data-view="timeline" title="Übersicht aller Mitarbeitenden (Z)"><svg class="icon sm"><use href="#i-timeline"/></svg><span>Übersicht</span></button>
        <button role="tab" data-view="calendar" title="Jahreskalender (K)"><svg class="icon sm"><use href="#i-calendar"/></svg><span>Kalender</span></button>
        <button role="tab" data-view="stats" title="Auswertung &amp; Anträge (A)"><svg class="icon sm"><use href="#i-chart"/></svg><span>Auswertung</span></button>
      </div>

      <div class="spacer"></div>
      <button class="cmdk hide-sm" data-action="palette" title="Befehlspalette: Aktionen, Personen, Datum (Strg+K)">
        <svg class="icon sm"><use href="#i-search"/></svg><span>Suchen &amp; Befehle</span><kbd>Strg</kbd><kbd>K</kbd>
      </button>
      <div class="spacer"></div>

      <div class="btn-group">
        <button class="btn ghost icon-only" data-action="undo" id="btn-undo" title="Rückgängig (Strg+Z)"><svg class="icon"><use href="#i-undo"/></svg></button>
        <button class="btn ghost icon-only" data-action="redo" id="btn-redo" title="Wiederholen (Strg+Y)"><svg class="icon"><use href="#i-redo"/></svg></button>
        <div class="divider-v hide-sm"></div>
        <button class="btn primary" data-action="new-absence" title="Neuer Eintrag (N)"><svg class="icon sm"><use href="#i-plus"/></svg><span class="hide-sm">Eintrag</span></button>
        <button class="btn ghost icon-only" data-action="employees" title="Mitarbeitende verwalten"><svg class="icon"><use href="#i-users"/></svg></button>
        <button class="btn ghost icon-only" data-action="export-menu" title="Export, Import &amp; Drucken"><svg class="icon"><use href="#i-download"/></svg></button>
        <button class="btn ghost icon-only" id="btn-sync" hidden title="Synchronisierung"><svg class="icon"><use href="#i-cloud"/></svg></button>
        <button class="btn ghost icon-only" data-action="settings" title="Einstellungen"><svg class="icon"><use href="#i-settings"/></svg></button>
        <button class="btn ghost icon-only hide-sm" data-action="theme" id="btn-theme" title="Darstellung wechseln"><svg class="icon"><use href="#i-sun"/></svg></button>
      </div>
    </header>

    <div class="toolbar" id="toolbar"></div>

    <main class="main" id="main">
      <section class="view" id="view-timeline" aria-label="Übersicht"></section>
      <section class="view" id="view-calendar" aria-label="Kalender"></section>
      <section class="view" id="view-stats" aria-label="Auswertung"></section>
    </main>

    <footer class="legend" id="legend"></footer>
